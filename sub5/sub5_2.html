                <div class="title_area">

                        HOME &gt; 아카이브 &gt; <strong>포토/영상갤러리</strong>

                </div>

                <div class="content_area">
                    <div class="deco_line"></div>
                    <div class="deco_diamond"></div>

                    <section class="top_video">
                        <span>THIS SEASON'S HIGHLIGHT</span>
                        <h3>이번 시즌, 무대 위의 가장 빛나는 순간</h3>
                        <p class="sub_txt">무대 위에서 펼쳐진 가장 빛나는 장면들을 영상으로 만나보세요</p>

                            <dt>무대스틸컷</dt>

                        </dl>
                    </section>

                    <section class="gallery">
                        <h3 data-aos="fade-up">SCENE ARCHIVE</h3>
                        <span data-aos="fade-up">포토와 영상으로 다시 만나는 무대</span>
                        <ul class="gallery_tab" data-aos="fade-up">
                            <li><button type="button" class="active" data-cate="all">전체</button></li>
                            <li><button type="button" data-cate="stage">무대스틸컷</button></li>
                            <li><button type="button" data-cate="practice">연습포토</button></li>
                        </ul>
                        <ul class="gallery_list" data-aos="fade-up">
                            <li class="big" data-cate="video">
                                <iframe src="https://www.youtube.com/embed/tZoH9C0EKQ4?autoplay=1&mute=1&loop=1&playlist=tZoH9C0EKQ4" title="겨울왕국 하이라이트 영상" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                            </li>
                            <li data-cate="stage"><img src="./img/sub2/stage01.jpg" alt="엘사가 얼음 궁전에서 노래하는 장면"></li>
                            <li data-cate="stage"><img src="./img/sub2/stage02.jpg" alt="엘사 무대 장면"></li>
                            <li data-cate="stage"><img src="./img/sub2/stage03.jpg" alt="안나가 무도회에 등장하는 장면"></li>
                            <li data-cate="stage"><img src="./img/sub2/stage04.jpg" alt="안나 초상화 앞 장면"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice01.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice02.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice03.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice04.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice05.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice06.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice07.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice08.jpg" alt="연습실에서 연기하는 배우"></li>
                            <li data-cate="practice"><img src="./img/sub2/practice09.jpg" alt="연습실에서 연기하는 배우"></li>

    </div>
    <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script src="../js/jquery.easing.1.3.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            //function(){}  ->  main_header.html의 로드가 완료가 되면
            $.getScript('../js/fullnav.js');  //스크립트 js파일을 동작시키는 메소드
        });

        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js');
        });
    </script>

    <script>
        $('.gallery_tab button').click(function(){

            $('.gallery_tab button').removeClass('active');  // 모든 탭 비활성화
            $(this).addClass('active');                      // 클릭한 탭만 활성화

            var cate = $(this).attr('data-cate');            // 클릭한 탭 이름

            if(cate == 'all'){
                $('.gallery_list li').fadeIn('slow');        // 전체: 다 보이기
            } else {
                $('.gallery_list li').hide();                                  // 다 숨기고
                $('.gallery_list li[data-cate="'+ cate +'"]').fadeIn('slow');  // 해당 것만 보이기
            }
        });
        </script>
        <script src="../js/aos.js"></script>
        <script>
        AOS.init({
            easing: 'ease-in-out-sine'
            });
        </script>
</body>
</html>
