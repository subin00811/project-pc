<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아카이브:역대공연</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="https://kit.fontawesome.com/f820e0ebf2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/aos.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="./css/sub5_common.css">
    <link rel="stylesheet" href="./css/sub5_1.css">
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>
    <div id="wrap">
        <header id="headerArea">
            
        </header>

        <div class="visual">
            <img src="./img/common/sub5_visual.jpg" alt="">
            <strong>아카이브</strong>
        </div>

        <div class="sub_nav">
            <ul>
                <li><a class="active" href="./sub5_1.html">역대공연</a></li>
                <li><a href="./sub5_2.html">포토/영상갤러리</a></li>
                <li><a href="./sub5_3.html">관람평</a></li>
            </ul>
        </div>

        <main id="content">
            <article>
                <div class="title_area">
                    <div class="line_map">
                        HOME &gt; 아카이브 &gt; <strong>역대공연</strong>
                    </div>
                    <h2>역대공연<span>Past Performances</span></h2>
                    <p>샤롯데씨어터 <span>무대에 올랐던 작품</span>들을 연도별로 만나보세요.</p>
                </div>

                <div class="content_area">
                    <div class="deco_line"></div>
                    <div class="deco_diamond"></div>
                    
                    <section>
                        <div class="product">
                            <h3 class="hidden">역대공연</h3>
                            <div class="product_top" data-aos="fade-up">
                                <ul class="category">
                                    <li><button type="button" class="btn_all active" data-cate="all">전체</button></li>
                                    <li><button type="button" data-cate="디즈니">디즈니</button></li>
                                    <li><button type="button" data-cate="라이선스">라이선스</button></li>
                                    <li><button type="button" data-cate="창작뮤지컬">창작뮤지컬</button></li>
                                </ul>

                                <div class="serch_box">
                                    <label for="title">공연명</label>
                                    <input id="title" name="title" type="text" placeholder="공연명으로 검색해보세요. (예 : 겨울왕국)" list="pro_list">
                                    <button id="btn" type="button">검색</button>

                                    <datalist id="pro_list">
                                        <option value="킹키부츠"></option>
                                        <option value="알라딘"></option>
                                        <option value="하데스타운"></option>
                                        <option value="데스노트"></option>
                                        <option value="지킬앤하이드"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div class="product_list" data-aos="fade-up">
                                <!-- 상품 리스트 출력 -->
                            </div>
                        </div>
                    </section>
                </div>

            </article>
        </main>







        <footer id="footerArea">
            
        </footer>

    </div>
    <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script src="../js/jquery.easing.1.3.js"></script>
    <script src="./sam.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            //function(){}  ->  main_header.html의 로드가 완료가 되면
            $.getScript('../js/fullnav.js');  //스크립트 js파일을 동작시키는 메소드
        });

        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js');
        });
    </script>
    <script src="../js/aos.js"></script>
    <script>
    AOS.init({
        easing: 'ease-in-out-sine'
        });
    </script>
</body>
</html>
